name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is set to "Deploy from a branch", GitHub also publishes the
      # raw source on every push, and whichever deploy finishes last is what
      # the site shows. Wait for that one, so this built app lands on top.
      - name: Wait for the branch deploy, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 72); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "none"')
            echo "branch deploy: $status"
            if [ "$status" = "completed" ]; then exit 0; fi
            # None after 30 seconds: Pages deploys from Actions only, nothing to wait for.
            if [ "$status" = "none" ] && [ "$i" -ge 6 ]; then exit 0; fi
            sleep 5
          done
          echo "Gave up waiting; deploying anyway."
      - id: deployment
        uses: actions/deploy-pages@v4
